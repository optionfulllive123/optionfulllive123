<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <title>Chwazi Plan - Option Full Live</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding-top: 30px; }
        .container { max-width: 450px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,255,0,0.3); }
        .plan-box { background: #2d2d2d; padding: 15px; margin: 15px 0; border-radius: 5px; border: 1px solid #444; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Chwazi Yon Plan</h2>
        <form action="/select-plan" method="POST">
            <div class="plan-box">
                <h3>Plan 1 Mwa (30 Jou)</h3>
                <p><b>$20 USD</b></p>
                <button type="submit" name="plan" value="1_month">Chwazi Plan sa</button>
            </div>
            <div class="plan-box">
                <h3>Plan 3 Mwa (90 Jou)</h3>
                <p><b>$50 USD</b></p>
                <button type="submit" name="plan" value="3_months">Chwazi Plan sa</button>
            </div>
            <div class="plan-box">
                <h3>Plan Unilimité</h3>
                <p><b>$150 USD</b></p>
                <button type="submit" name="plan" value="lifetime">Chwazi Plan sa</button>
            </div>
        </form>
    </div>
</body>
</html>
