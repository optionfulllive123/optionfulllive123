<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <title>Option Full Live - Enskripsyon</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding-top: 50px; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,255,0,0.3); }
        input { width: 90%; padding: 12px; margin: 10px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; }
        button { width: 95%; padding: 12px; background: #28a745; color: white; border: none; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Option Full Live</h2>
        <p>Antre non w ak imèl ou pou w kontinye sou plan abònman yo:</p>
        <form action="/register" method="POST">
            <input type="text" name="name" placeholder="Non ou" required><br>
            <input type="email" name="email" placeholder="Imèl ou" required><br>
            <button type="submit">Kontinye</button>
        </form>
    </div>
</body>
</html>
