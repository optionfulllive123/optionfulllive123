<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <title>Option Full Live - Siyal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding-top: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,255,0,0.3); }
        .signal-box { background: #2d2d2d; padding: 15px; margin: 10px 0; border-radius: 5px; border-left: 5px solid #28a745; text-align: left; }
    </style>
    <script>
        window.onload = function() {
            if (!window.location.search.includes('user_time')) {
                let now = new Date().toISOString().slice(0, 19).replace('T', ' ');
                window.location.href = "/signals?user_time=" + encodeURIComponent(now);
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <h2>Option Full Live - Siyal An Dirèk</h2>
        <p>Aksè w valab. Bot la ap voye siyal yo chak 5 minit an avans!</p>
        
        <div class="signal-box">
            <h4>Estati Bot la: <span style="color: #28a745;">Aktif 🟢</span></h4>
            <p>Lè Sèvè / Telefòn: {{ current_time }}</p>
        </div>

        <div id="live-signals">
            <p>Ap tann pwochen siyal la (1 minit an avans)...</p>
        </div>
    </div>
</body>
</html>
