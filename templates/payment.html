<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <title>Peman - Option Full Live</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding-top: 30px; }
        .container { max-width: 450px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,255,0,0.3); }
        .wallet-box { background: #2d2d2d; padding: 10px; word-break: break-all; border: 1px dashed #28a745; margin: 15px 0; border-radius: 5px; font-family: monospace; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .tg-link { color: #17a2b8; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Detay Peman</h2>
        <p>Tanpri voye montan ki koresponn lan nan adrès Litecoin (LTC) SafePal nou an:</p>
        
        <div class="wallet-box" id="ltcAddress">{{ ltc_address }}</div>
        
        <button onclick="copyLTC()">Kopie Adrès LTC & Valide</button>
        
        <p style="margin-top: 20px;">Lè w fin peye, kontakte nou sou Telegram pou verifikasyon rapid:</p>
        <p><a class="tg-link" href="https://t.me/{{ telegram }}" target="_blank">Kontakte Nou sou Telegram ({{ telegram }})</a></p>
    </div>

    <script>
        function copyLTC() {
            let addressText = document.getElementById("ltcAddress").innerText;
            navigator.clipboard.writeText(addressText).then(() => {
                fetch('/mark-copied', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        alert("Adrès LTC kopie ak siksè! W ap jwenn aksè.");
                        window.location.href = "/signals";
                    }
                });
            });
        }
    </script>
</body>
</html>
